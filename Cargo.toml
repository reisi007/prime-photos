[package]
name = "prime-photos"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
default = ["legacy-eframe"]
legacy-eframe = ["dep:eframe", "dep:egui"]
# Explicit opt-in to the production Rune backup route. This does not change the
# default launcher; eframe remains the normal application UI.
rune-backup = ["dep:rune"]
# Debug-only Rune migration fixtures and verification routes. The production
# backup route is also available through `rune-backup` in release builds.
rune-ui-spike = ["rune-backup"]

[dependencies]
chrono = { version = "0.4.40", features = ["serde"] }
auto-launch = "0.6"
# Streaming upload body (Befund 11c): `reqwest::Body::wrap_stream` hands the
# file to the transport in chunks, so the upload path can count the bytes it
# actually sent. `bytes` is already in the graph transitively via reqwest; it is
# promoted to a direct dependency because the streamed item type
# (`Result<Bytes, io::Error>`) is named in our own code.
bytes = "1"
clap = { version = "4.5.37", features = ["derive"] }
dirs = "6.0.0"
env_logger = "0.11.8"
indicatif = "0.17.11"
log = "0.4.27"
md5 = "0.8.1"
notify = "8.2.0"
notify-rust = "4.18"
# `stream` enables `reqwest::Body::wrap_stream`, the chunked upload body the
# per-file progress counter is built on (Befund 11c). Not part of reqwest's
# default feature set.
reqwest = { version = "0.12.15", features = ["json", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44.2", features = ["full"] }
futures = "0.3"
toml = "0.8.20"
walkdir = "2.5.0"
eframe = { version = "0.36", optional = true }
egui = { version = "0.36", optional = true }
rfd = "0.15"
image = "0.25"
wry = "0.57.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tray-icon = "0.26"
unicode-normalization = "0.1.25"
# Device login flow (`src/auth.rs`): `sha2` + `base64` build the PKCE S256
# challenge, `rand` supplies the verifier / device-serial entropy, `keyring`
# keeps the refresh token in the OS credential store.
sha2 = "0.10"
base64 = "0.23"
rand = "0.10"
# `default-features = false` + explicit per-OS stores keeps the **blocking** API
# on every target: macOS Keychain (`apple-native`), Windows Credential Manager
# (`windows-native`) and the Linux Secret Service (`sync-secret-service`, with
# `crypto-rust` as its session-encryption backend). No async/zbus stack is
# pulled in.
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# Issue #49 Rune backup / migration work. Keep the exact tested revision and
# avoid Rune's broad defaults; the optional feature is not enabled in normal builds.
# native-file-dialog supplies the Linux XDG portal path (and enables D-Bus);
# accessibility preserves native platform trees; Metal is used only on Apple.
# SVG is omitted because our existing build.rs raster pipeline supplies PNGs.
rune = { git = "https://github.com/anomalyco/rune", rev = "53c7f60f51ce12bd5da53145d9d86ce1552324e4", optional = true, default-features = false, features = ["accessibility", "dbus", "metal-backend", "native-file-dialog"] }

[build-dependencies]
# Rasterises `assets/*.svg` into PNGs inside `OUT_DIR` (see `build.rs`).
# Pure Rust so the Linux/Windows CI can build the assets too; `default-features
# = false` drops the text/font and raster-image stacks (the sources have no
# text and no embedded images). Build-time only — the shipped binary carries no
# resvg code and no SVG parsing, just the embedded PNG bytes.
resvg = { version = "0.49", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
objc2 = "0.6"
# `NSResponder` (`src/app_menu.rs`, plus the `NSApplication` calls) and
# `NSRunningApplication` (the feature that also unlocks `setActivationPolicy` /
# `NSApplicationActivationPolicy`, used by `src/app_activation.rs`) are requested
# **explicitly**: they are active today only through transitive feature
# unification (webbrowser ← egui-winit, muda, tray-icon, wry, …), which is no
# promise. Listing them here pins the features our own code names.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSLocale", "NSString", "NSAppleEventManager", "NSAppleEventDescriptor", "objc2-core-services"] }

# Project rule (AGENTS.md): the warning baseline is 0 and is enforced, not just
# observed. `warnings` is rustc's warn-by-default lint group; denying it turns
# every warning in this package (binary, build script, tests, benches) into a
# build error. Dependencies are unaffected (they run under `cap-lints`). Do not
# silence a finding with `#[allow]` — fix it, or report it.
[lints.rust]
warnings = "deny"

name: Release

# Release nur über einen Git-Tag v* (z. B. v0.1.0).
#
# Signierung (Windows via SignPath, Linux via GPG) läuft ausschließlich in diesem
# Workflow, also nur bei einem Tag-Push im Haupt-Repo. Secrets werden niemals an
# Fork-PRs weitergereicht (pull_request aus einem Fork sieht sie nicht). Ist ein
# Signatur-Secret gesetzt, führt ein Fehler im Signaturschritt zum Fehlschlag des
# Jobs — es wird dann kein unsigniertes Artefakt still veröffentlicht.
on:
  push:
    tags:
      - "v*"

# Least privilege auf oberster Ebene; die Jobs heben nur an, was sie brauchen.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Der SignPath-Connector liest Workflow-/Job-Metadaten und das hochgeladene Artefakt.
      actions: read
    strategy:
      # Ein fehlgeschlagenes Bein darf die anderen nicht abbrechen; der Release-Job
      # läuft trotzdem nur, wenn ALLE Beine erfolgreich sind (needs-Kette).
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: ubuntu-latest
            artifact: linux-x64

    # Signatur-Konfiguration als Job-Env verfügbar machen (der `secrets`-Kontext ist in
    # job-level `if` nicht zuverlässig -> in Schritten über `env.X == 'true'` prüfen).
    # Fehlen die Secrets, wird unsigniert gebaut und veröffentlicht.
    # Namen sind in docs/dev/RELEASE.md §3 dokumentiert.
    #
    # Least Privilege: Hier stehen nur nicht-geheime Schalter und Variablen. Ein Job-Env
    # ist für JEDEN Schritt sichtbar, also auch für Third-Party-Actions wie die
    # Rust-Toolchain und den Cargo-Cache; die Secrets stehen deshalb ausschließlich im
    # `env:` des Schritts, der sie braucht.
    env:
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
      GPG_ENABLED: ${{ secrets.GPG_PRIVATE_KEY != '' }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # System-Abhängigkeiten (docs/dev/BUILD.md §5): wry/WebKitGTK 4.1 + GTK3,
      # tray-icon (libayatana-appindicator3), native-tls (System-OpenSSL),
      # pkg-config + C-Compiler (rusqlite "bundled" übersetzt SQLite aus C-Quellen).
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            pkg-config \
            build-essential

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: cargo build --release --locked
        run: cargo build --release --locked

      # --- Windows: SignPath (SignPath Foundation), nur wenn SIGNPATH_API_TOKEN gesetzt ---
      # 1) Unsigned exe als Workflow-Artefakt bereitstellen (SignPath holt sie über die API).
      - name: Upload unsigned Windows binary for SignPath
        id: signpath-upload
        if: matrix.os == 'windows-latest' && env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-signing-input
          path: target/release/prime-photos.exe
          if-no-files-found: error
          retention-days: 1

      # 2) Signieranfrage stellen und auf das signierte Artefakt warten.
      - name: Submit SignPath signing request
        if: matrix.os == 'windows-latest' && env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        # Das API-Token steht nur hier im Schritt-Env, nicht auf Job-Ebene (siehe oben).
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        # `actions/upload-artifact@v4` verpackt das Artefakt immer als ZIP (ein `archive`-Input
        # gibt es dort nicht). SignPath erwartet deshalb eine Artifact Configuration mit
        # `<zip-file>` als Wurzel; `skip-decompress` bleibt auf dem Default `false`, damit das
        # signierte ZIP nach `signed/` entpackt wird und `signed/prime-photos.exe` entsteht.
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.signpath-upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # 3) Signierte Binary einsetzen.
      - name: Replace Windows binary with signed one
        if: matrix.os == 'windows-latest' && env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          Copy-Item -Force signed/prime-photos.exe target/release/prime-photos.exe

      # 4) Signatur prüfen; ein ungültiger Status bricht den Job ab.
      - name: Verify Windows Authenticode signature
        if: matrix.os == 'windows-latest' && env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature -FilePath target/release/prime-photos.exe
          Write-Host "Signature status: $($sig.Status) — signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            throw "Authenticode signature is not valid (status: $($sig.Status))"
          }

      # --- Paketierung ---
      - name: Package Windows binary (.zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path target/release/prime-photos.exe `
            -DestinationPath release/Prime-Photos-windows-x64.zip

      - name: Package Linux binary (.tar.gz)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p release
          tar -czf release/Prime-Photos-linux-x64.tar.gz -C target/release prime-photos

      # Debian-Paket aus derselben Release-Binary und dem im Build erzeugten Iconset.
      # `dpkg-shlibdeps` ermittelt die deklarierten Laufzeit-Abhängigkeiten aus den ELF-Bibliotheken
      # (u. a. libwebkit2gtk-4.1-0, libgtk-3-0); die Tray-Bibliothek wird per `dlopen` geladen und
      # ist für `dpkg-shlibdeps` unsichtbar, deshalb ergänzt `make-deb.sh` sie als Alternative
      # `libayatana-appindicator3-1 | libappindicator3-1` selbst. VERSION kommt aus dem Tag.
      - name: Package Linux binary (.deb)
        if: matrix.os == 'ubuntu-latest'
        env:
          VERSION: ${{ github.ref_name }}
        run: bash packaging/make-deb.sh --binary target/release/prime-photos --iconset target/pp-appicon.iconset --output release

      # --- Linux: abgetrennte, ASCII-armored GPG-Signatur, nur wenn GPG_PRIVATE_KEY gesetzt ---
      # Signiert werden beide Linux-Artefakte (Tarball und .deb); der öffentliche Schlüssel wird
      # genau einmal exportiert (erster Aufruf mit Zielpfad, zweiter ohne).
      # Das .deb selbst ist NICHT dpkg-signiert: `debsig-verify` bzw. eine signierte
      # Repository-/Paketquelle wäre ein eigener Vertriebskanal und ist hier ausdrücklich out of
      # scope — es entsteht nur die abgetrennte `.asc`. Sowohl das `.deb` als auch seine `.asc`
      # fallen unter das bestehende Attestation-Glob `artifacts/Prime-Photos-*`.
      - name: Sign Linux release artifacts (GPG)
        if: matrix.os == 'ubuntu-latest' && env.GPG_ENABLED == 'true'
        # Das Schlüsselmaterial steht nur hier im Schritt-Env, nicht auf Job-Ebene (siehe oben).
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          bash scripts/sign-linux-release.sh release/Prime-Photos-linux-x64.tar.gz release/Prime-Photos-release-key.asc
          bash scripts/sign-linux-release.sh release/Prime-Photos-linux-x64.deb

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    # Läuft nur, wenn ALLE Matrix-Beine erfolgreich waren (fail-fast: false
    # in der Matrix, Standard-needs-Semantik hier).
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      # Build-Provenance-Attestations (Sigstore/OIDC).
      id-token: write
      attestations: write
    steps:
      # Nur die finalen Matrix-Artefakte; `windows-signing-input` wird dadurch
      # bewusst ausgeschlossen (Pattern `*-x64`).
      - name: Download final artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*-x64"
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -laR artifacts

      # Herkunftsnachweis vor dem Upload erzeugen; das Glob deckt alle vorhandenen
      # Artefakte ab (inkl. `.asc` und Public Key, sofern GPG konfiguriert ist).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "artifacts/Prime-Photos-*"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
